<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CodeAgent OJ · Language Selector</title>
  <style>
    :root{--paper:#f3f1eb;--surface:#ebe9e2;--ink:#252a2d;--muted:#858981;--line:#d8d5ce;--editor:#282d2f;--editor-line:#454a4a;--accent:#d37737;--green:#3e8a69}
    *{box-sizing:border-box}body{margin:0;min-height:100dvh;background:#dedbd4;color:var(--ink);font:13px/1.55 "Avenir Next","Segoe UI","Microsoft YaHei",sans-serif}
    .frame{display:grid;grid-template-columns:minmax(360px,1fr) minmax(360px,.58fr);width:min(1180px,calc(100% - 32px));min-height:calc(100dvh - 32px);margin:16px auto;border:1px solid #d1cec7;background:var(--paper);box-shadow:0 18px 55px rgba(39,44,45,.12)}
    .editor{display:flex;min-width:0;flex-direction:column;background:var(--editor)}.editor-bar{display:flex;align-items:center;justify-content:space-between;height:64px;padding:0 20px;border-bottom:1px solid var(--editor-line);color:#cbd1ca}.file{display:flex;align-items:center;gap:9px;font:13px Consolas,monospace}.file-mark{color:#b9c5bb;font-size:17px;letter-spacing:-4px}
    .language-picker{position:relative}.language-trigger{display:flex;align-items:center;gap:9px;min-width:142px;height:36px;padding:0 10px 0 13px;border:1px solid #5b6560;border-radius:6px;color:#eef1ec;background:#303637;font:12px Consolas,monospace;cursor:pointer;transition:border-color .2s ease,background .2s ease,transform .2s ease}.language-trigger:hover,.language-picker.open .language-trigger{border-color:var(--accent);background:#353c3b}.language-trigger:active{transform:translateY(1px)}.language-trigger .language-dot{width:7px;height:7px;border-radius:50%;background:#71ad8d;box-shadow:0 0 0 3px rgba(113,173,141,.12)}.language-trigger .chevron{margin-left:auto;color:#9fa9a1;font-size:11px;transition:transform .2s ease}.language-picker.open .chevron{transform:rotate(180deg)}
    .language-menu{position:absolute;top:calc(100% + 8px);right:0;z-index:2;width:224px;padding:7px;border:1px solid #505a55;border-radius:8px;background:#303637;box-shadow:0 14px 30px rgba(14,18,18,.28);opacity:0;pointer-events:none;transform:translateY(-5px);transition:opacity .18s ease,transform .18s ease}.language-picker.open .language-menu{opacity:1;pointer-events:auto;transform:translateY(0)}.menu-caption{padding:6px 9px 7px;color:#8e9991;font:10px Consolas,monospace;letter-spacing:.06em;text-transform:uppercase}.language-option{display:grid;grid-template-columns:25px 1fr auto;align-items:center;gap:7px;width:100%;padding:9px;border:0;border-radius:5px;color:#d8ded8;background:transparent;text-align:left;cursor:pointer}.language-option:hover{background:#3a4340}.language-option.active{background:rgba(211,119,55,.15);color:#fff}.language-option .option-mark{display:grid;place-items:center;width:22px;height:22px;border:1px solid #64706a;border-radius:4px;color:#a9b9ad;font:10px Consolas,monospace}.language-option.active .option-mark{border-color:var(--accent);color:#f0b486}.language-option strong{font:12px "Avenir Next","Segoe UI",sans-serif}.language-option small{display:block;margin-top:1px;color:#8f9b92;font:10px Consolas,monospace}.language-option .check{color:var(--accent);font-size:14px;opacity:0}.language-option.active .check{opacity:1}
    .code{flex:1;min-height:360px;padding:25px 22px;color:#d8ddd6;background:#202425;font:13px/1.85 Consolas,monospace}.line{display:grid;grid-template-columns:35px 1fr}.num{padding-right:17px;color:#747d75;text-align:right}.kw{color:#5da5e9}.fn{color:#8dc7a0}.editor-foot{display:flex;align-items:center;justify-content:space-between;min-height:70px;padding:0 20px;border-top:1px solid var(--editor-line);color:#9da59d}.actions{display:flex;gap:9px}.actions button{height:38px;padding:0 16px;border:1px solid #667069;color:#e1e5df;background:transparent;font-weight:700;cursor:pointer}.actions .primary{border-color:var(--accent);background:var(--accent);color:#fff}
    .side{background:var(--paper)}.side-top{padding:25px;border-bottom:1px solid var(--line)}.eyebrow{margin:0 0 8px;color:var(--muted);font:600 10px Consolas,monospace;letter-spacing:.1em}.side h1{margin:0;font-size:25px}.metrics{display:grid;grid-template-columns:repeat(3,1fr);margin-top:24px;border-block:1px solid var(--line)}.metric{padding:14px 10px 13px 0}.metric+.metric{padding-left:14px;border-left:1px solid var(--line)}.metric small{display:block;color:var(--muted);font-size:10px}.metric strong{display:block;margin-top:5px;font:700 17px Consolas,monospace}.debug{padding:23px 25px}.debug h2{margin:0;font-size:18px}.copy{margin:5px 0;color:var(--muted);font-size:11px}.field{display:grid;gap:7px;margin-top:21px;color:#666c65;font-size:11px;font-weight:700}.field textarea{width:100%;min-height:70px;padding:10px;border:1px solid #c9c7bf;resize:vertical;color:#3c423e;background:var(--surface);font:12px/1.55 Consolas,monospace}.run{width:100%;height:36px;margin-top:10px;border:1px solid var(--accent);color:#fff;background:var(--accent);font-weight:700;cursor:pointer}.terminal{min-height:105px;margin-top:20px;padding:13px;border:1px solid #414846;color:#d4dbd4;background:var(--editor);font:11px/1.65 Consolas,monospace}.terminal .muted{display:block;color:#849087}.status{display:flex;gap:7px;margin-top:9px;color:var(--green);font:10px Consolas,monospace}.status i{width:6px;height:6px;margin-top:4px;border-radius:50%;background:var(--green)}
    @media(max-width:820px){.frame{grid-template-columns:1fr;width:calc(100% - 20px);margin:10px}.editor{min-height:520px}.side{min-height:620px}}
  </style>
</head>
<body>
  <main class="frame">
    <section class="editor">
      <header class="editor-bar">
        <span class="file"><span class="file-mark">&lt;/&gt;</span>Main.java</span>
        <div class="language-picker" id="languagePicker">
          <button class="language-trigger" id="languageTrigger" type="button" aria-expanded="false" aria-haspopup="listbox"><span class="language-dot"></span><span id="selectedLanguage">Java 21</span><span class="chevron">⌄</span></button>
          <div class="language-menu" role="listbox" aria-label="选择编程语言">
            <div class="menu-caption">编程语言</div>
            <button class="language-option active" type="button" role="option" aria-selected="true" data-language="Java 21" data-file="Main.java"><span class="option-mark">J</span><span><strong>Java 21</strong><small>稳定运行环境</small></span><span class="check">✓</span></button>
            <button class="language-option" type="button" role="option" aria-selected="false" data-language="C++17" data-file="main.cpp"><span class="option-mark">C++</span><span><strong>C++17</strong><small>GNU标准库</small></span><span class="check">✓</span></button>
            <button class="language-option" type="button" role="option" aria-selected="false" data-language="C17" data-file="main.c"><span class="option-mark">C</span><span><strong>C17</strong><small>ISO C标准</small></span><span class="check">✓</span></button>
          </div>
        </div>
      </header>
      <div class="code"><div class="line"><span class="num">1</span><span><span class="kw">import</span> java.io.*;</span></div><div class="line"><span class="num">2</span><span></span></div><div class="line"><span class="num">3</span><span><span class="kw">public class</span> Main {</span></div><div class="line"><span class="num">4</span><span>&nbsp;&nbsp;<span class="kw">public static void</span> <span class="fn">main</span>(String[] args) {</span></div><div class="line"><span class="num">5</span><span>&nbsp;&nbsp;&nbsp;&nbsp;<span class="kw">//</span> Read stdin and print stdout.</span></div><div class="line"><span class="num">6</span><span>&nbsp;&nbsp;}</span></div><div class="line"><span class="num">7</span><span>}</span></div></div>
      <footer class="editor-foot"><span>&#9679; 公开样例最长 3 秒</span><div class="actions"><button>▷ 运行</button><button class="primary">↗ 提交</button></div></footer>
    </section>
    <aside class="side"><section class="side-top"><p class="eyebrow">EXECUTION RESULT</p><h1>尚未运行</h1><div class="metrics"><div class="metric"><small>运行时间</small><strong>--</strong></div><div class="metric"><small>内存占用</small><strong>--</strong></div><div class="metric"><small>测试结果</small><strong>0/0</strong></div></div></section><section class="debug"><p class="eyebrow">DEBUG CONSOLE</p><h2>样例调试</h2><p class="copy">修改标准输入，单独检查程序输出。</p><label class="field">标准输入<textarea>nums = [2, 7, 11, 15]&#10;target = 9</textarea></label><button class="run">▷ 运行样例</button><div class="terminal"><span class="muted">$ javac Main.java</span><span class="muted">$ java Main</span><span>点击“运行样例”查看输出</span></div><div class="status"><i></i>尚未运行</div></section></aside>
  </main>
  <script>
    const picker=document.querySelector('#languagePicker'),trigger=document.querySelector('#languageTrigger'),selected=document.querySelector('#selectedLanguage'),file=document.querySelector('.file'),options=[...document.querySelectorAll('.language-option')];
    trigger.addEventListener('click',()=>{const open=picker.classList.toggle('open');trigger.setAttribute('aria-expanded',String(open));});
    options.forEach(option=>option.addEventListener('click',()=>{options.forEach(item=>{item.classList.remove('active');item.setAttribute('aria-selected','false');});option.classList.add('active');option.setAttribute('aria-selected','true');selected.textContent=option.dataset.language;file.lastChild.textContent=option.dataset.file;picker.classList.remove('open');trigger.setAttribute('aria-expanded','false');}));
    document.addEventListener('click',event=>{if(!picker.contains(event.target)){picker.classList.remove('open');trigger.setAttribute('aria-expanded','false');}});
  </script>
</body>
</html>
